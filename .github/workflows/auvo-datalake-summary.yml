name: Auvo Data Lake - Resumo Rapido

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Meses a resumir, separados por virgula (YYYY-MM)"
        required: true
        default: "2026-07,2026-08,2026-09"

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r datalake/requirements.txt

      - name: Gerar resumo
        working-directory: datalake
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_REGION: ${{ vars.B2_REGION }}
          INPUT_MONTHS: ${{ inputs.months }}
        run: python quick_summary.py --months "$INPUT_MONTHS"
