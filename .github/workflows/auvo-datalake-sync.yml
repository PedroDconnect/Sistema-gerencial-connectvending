name: Auvo Data Lake - Sync Diario

on:
  schedule:
    # 06:00 UTC = 03:00 America/Sao_Paulo (sem horario de verao desde 2019)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r datalake/requirements.txt

      - name: Reconferir meses recentes
        working-directory: datalake
        env:
          AUVO_API_KEY: ${{ secrets.AUVO_API_KEY }}
          AUVO_API_TOKEN: ${{ secrets.AUVO_API_TOKEN }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_REGION: ${{ vars.B2_REGION }}
        run: python sync_recent.py --months 2
