name: Auvo Data Lake - Carga Inicial no Supabase

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Meses ja arquivados no B2 a empurrar pro Supabase (YYYY-MM, separados por virgula)"
        required: true
        default: "2026-07,2026-08,2026-09"

jobs:
  push-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r datalake/requirements.txt

      - name: Empurrar meses existentes pro Supabase
        working-directory: datalake
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_REGION: ${{ vars.B2_REGION }}
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          HISTORY_INGEST_TOKEN: ${{ secrets.HISTORY_INGEST_TOKEN }}
          INPUT_MONTHS: ${{ inputs.months }}
        run: python push_existing_to_supabase.py --months "$INPUT_MONTHS"
